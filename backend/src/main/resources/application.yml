server:
  address: 127.0.0.1

focusdesktop:
  session:
    interval-check-delay-ms: 5000

spring:
  datasource:
    url: jdbc:h2:file:${focusdesktop.data-dir}/focusdesktop;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none

