0" font-size="13" textLength="236.888">Only one interval is active at a time.</text><text x="619.42" y="299.497" fill="#000" font-size="13" textLength="241.135">A work interval is followed by a short</text><text x="619.42" y="314.629" fill="#000" font-size="13" textLength="204.744">break, or a long break after the</text><text x="619.42" y="329.762" fill="#000" font-size="13" textLength="241.338">configured number of work intervals.</text></g><g class="entity" data-qualified-name="GMN27" id="ent0028" data-source-line="40"><path d="M609.08,429.837 L609.08,453.537 L574.71,457.537 L609.08,461.537 L609.08,485.235 A0,0 0 0 0 609.08,485.235 L944.092,485.235 A0,0 0 0 0 944.092,485.235 L944.092,439.837 L934.092,429.837 L609.08,429.837 A0,0 0 0 0 609.08,429.837" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M934.092,429.837 L934.092,439.837 L944.092,439.837 L934.092,429.837" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="615.08" y="446.904" fill="#000" font-size="13" textLength="304.459">The previous interval is complete and the next</text><text x="615.08" y="462.037" fill="#000" font-size="13" textLength="314.012">interval is pending. No countdown runs until the</text><text x="615.08" y="477.169" fill="#000" font-size="13" textLength="104.66">learner starts it.</text></g><g class="entity" data-qualified-name="GMN30" id="ent0031" data-source-line="46"><path d="M230.99,582.097 L230.99,598.227 L196.02,602.227 L230.99,606.227 L230.99,622.363 A0,0 0 0 0 230.99,622.363 L510.187,622.363 A0,0 0 0 0 510.187,622.363 L510.187,592.097 L500.187,582.097 L230.99,582.097 A0,0 0 0 0 230.99,582.097" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M500.187,582.097 L500.187,592.097 L510.187,592.097 L500.187,582.097" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="236.99" y="599.164" fill="#000" font-size="13" textLength="258.197">Completed sessions are immutable and</text><text x="236.99" y="614.297" fill="#000" font-siz