18;stroke-width:1;stroke-dasharray:2,2;"/><text x="56.995" y="176.793" fill="#000" font-size="13" font-weight="700">2</text><text x="70.041" y="176.793" fill="#000" font-size="13" textLength="821.679">analytics(from, to, totalFocusSeconds, totalBreakSeconds, completedSessions, averageSessionSeconds, focusScore, bestDay)</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg3" data-source-line="9"><polygon points="50.995,206.992,40.995,210.992,50.995,214.992,46.995,210.992" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="44.995" y1="210.992" x2="897.719" y2="210.992" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="56.995" y="205.926" fill="#000" font-size="13" font-weight="700">3</text><text x="70.041" y="205.926" fill="#000" font-size="13" textLength="474.576">dailyBreakdown(date, focusSeconds, breakSeconds, completedSessions)</text></g><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg4" data-source-line="11"><polygon points="886.719,236.125,896.719,240.125,886.719,244.125,890.719,240.125" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="39.995" y1="240.125" x2="892.719" y2="240.125" style="stroke:#181818;stroke-width:1;"/><text x="46.995" y="235.059" fill="#000" font-size="13" font-weight="700">4</text><text x="60.041" y="235.059" fill="#000" font-size="13" textLength="243.896">requestOverviewGoalProgress(today)</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg5" data-source-line="12"><polygon points="50.995,265.258,40.995,269.258,50.995,273.258,46.995,269.258" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="44.995" y1="269.258" x2="897.719" y2="269.258" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="56.995" y="264.192" fill="#000" font-size="13" font-weight="700">5</text><text x="70.041" y="264.192" fill="#000" font-size="13" textLength="710.703">dailyGoalProgress(completedFocus, activeCompletedWork, currentWorkIntervalAfter300Seconds, goalHours)</text></g><path d="M903.719,282.258 L903.719,458.258 L1417.719,458.258 L1417.719,292.258 L1407.719,282.258 L903.719,282.258" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1407.719,282.258 L1407.719,292.258 L1417.719,292.258 L1407.719,282.258" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="909.719" y="299.325" fill="#000" font-size="13" textLength="293.668">Explicit date bounds are inclusive local dates</text><text x="909.719" y="314.458" fill="#000" font-size="13" textLength="309.378">and limited to 366 days. With no bounds, totals</text><text x="909.719" y="329.59" fill="#000" font-size="13" textLength="276.917">cover all completed sessions and the daily</text><text x="909.719" y="344.723" fill="#000" font-size="13" textLength="271.127">breakdown covers the latest 7 local days.</text><text x="909.719" y="359.856" fill="#000" font-size="13" textLength="305.506">Focus score is actual work time / planned work</text><text x="909.719" y="374.989" fill="#000" font-size="13" textLength="322.309">time, rounded and clamped to 0..100. Distraction</text><text x="909.719" y="390.122" fill="#000" font-size="13" textLength="270.436">metrics are deferred until tracking exists.</text><text x="909.719" y="405.254" fill="#000" font-size="13" textLength="173.697">No data leaves the device.</text><text x="909.719" y="420.387" fill="#000" font-size="13" textLength="493.016">Overview also counts completed work intervals from the active session and</text><text x="909.719" y="435.52" fill="#000" font-size="13" textLength="485.285">adds its current work interval after that interval reaches 300 seconds. The</text><text x="909.719" y="450.653" fill="#000" font-size="13" textLength="450.728">current interval contribution pauses during a break or session pause.</text><?plant