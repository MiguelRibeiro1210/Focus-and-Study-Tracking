:#181818;stroke-width:0.5;" fill="none"/><rect x="754.676" y="403.902" width="157.457" height="33.068" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="761.676" y="425.868" fill="#000" font-size="14" textLength="143.457">FocusDesktop System</text><polygon points="821.404,156.842,831.404,160.842,821.404,164.842,825.404,160.842" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="38.599" y1="160.842" x2="827.404" y2="160.842" style="stroke:#181818;stroke-width:1;"/><text x="45.599" y="155.033" fill="#000" font-size="13" font-weight="700">1</text><text x="57.035" y="155.033" fill="#000" font-size="13" textLength="158.197">requestAnalytics(from, to)</text><polygon points="49.599,188.548,39.599,192.548,49.599,196.548,45.599,192.548" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="43.599" y1="192.548" x2="832.404" y2="192.548" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="55.599" y="186.739" fill="#000" font-size="13" font-weight="700">2</text><text x="67.035" y="186.739" fill="#000" font-size="13" textLength="759.37">analytics(from, to, totalFocusSeconds, totalBreakSeconds, completedSessions, averageSessionSeconds, focusScore, bestDay)</text><polygon points="49.599,220.254,39.599,224.254,49.599,228.254,45.599,224.254" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="43.599" y1="224.254" x2="832.404" y2="224.254" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="55.599" y="218.445" fill="#000" font-size="13" font-weight="700">3</text><text x="67.035" y="218.445" fill="#000" font-size="13" textLength="440.622">dailyBreakdown(date, focusSeconds, breakSeconds, completedSessions)</text><path d="M838.404,237.254 L838.404,388.254 L1157.404,388.254 L1157.404,247.254 L1147.404,237.254 L838.404,237.254" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1147.404,237.254 L1147.404,247.254 L1157.404,247.254 L1147.404,237.254" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="844.404" y="256.151" fill="#000" font-size="13" textLength="271.011">Explicit date bounds are inclusive local dates</text><text x="844.404" y="273.857" fill="#000" font-size="13" textLength="286.923">and limited to 366 days. With no bounds, totals</text><text x="844.404" y="291.563" fill="#000" font-size="13" textLength="256.152">cover all completed sessions and the daily</text><text x="844.404" y="309.269" fill="#000" font-size="13" textLength="249.782">breakdown covers the latest 7 local days.</text><text x="844.404" y="326.975" fill="#000" font-size="13" textLength="284.869">Focus score is actual work time / planned work</text><text x="844.404" y="344.681" fill="#000" font-size="13" textLength="298.974">time, rounded and clamped to 0..100. Distraction</text><text x="844.404" y="362.387" fill="#000" font-size="13" textLength="251.043">metrics are deferred until tracking exists.</text><text x="844.404" y="380.093" fill="#000" font-size="13" textLength="159.081">No data leaves the device.</text><?plantuml-src VL9DZzCm4BtdLppjQLTgGn7I8lQ011HE2255YFF4cRPM7K-m9ztDlsUS9kM0u52bUVE-F8vw3OocsMEB7v-sktVs_9wa6vtwYzS97oA5IRtBLKMZIXpxbbD5JYNXArEAzZPGCeOVA2hkleWRyvxpMML0CsNb_WwKbxzLjOYmVRz0U4BYNoDdlMNT7vBq6wWyL0jdQ_HL-GJwYrX-Ic4ERzX9xF82VKnCvnlaf1y2AtSDv-mb6aGNJdJa1RWn3xELayGRj5PkJzC_sdJampJ7TF8SxpjINkMhMVl_4WzL5KKPoHzF2Zciom8-lmp1LgiehcXbD0DGOlZemfZzXH74KPZdsGGKEmJVUtEty-FDuwEDfbpZfzSJeYmUotAAmeaj01J2drx8Ix7PJazyFQEHs_MOLrcUXw5aAzxUgbYUSUVBG2uhX3ShfwDDdoMTeRvdlC8GA4QBAvW92hf1AWKDBD4kK3zSJxAhwzUxNOszpvhCo-gPf6TDzXtCA-dum2aPUupg0mhhxECH_6AIkT4tANiY1BPBltRl-E8TrnLRMhc3wZS0?></g></svg>