name: Bug report
description: Report a reproducible problem in FocusDesktop.
title: "[Bug]: "
labels:
  - bug
assignees:
  - MiguelRibeiro1210
body:
  - type: markdown
    attributes:
      value: >-
        Please search existing issues first. Do not attach API tokens, database
        files, or logs containing private data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and include the relevant FST story ID, if known.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that reliably reproduces the problem.
      placeholder: |
        1. Start FocusDesktop...
        2. Open...
        3. Select...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS Intel
        - macOS Apple Silicon
        - Linux
        - Browser development
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: FocusDesktop version
      placeholder: "For example: 0.1.0"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove tokens, personal data, and private file paths before attaching.
    validations:
      required: false
