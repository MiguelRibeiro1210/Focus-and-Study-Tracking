name: Build and package FocusDesktop

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify backend and frontend
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Verify backend
        run: ./mvnw clean verify
        working-directory: backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend checks
        run: npm run build && npm run lint && npm test
        working-directory: frontend

  package:
    name: Package ${{ matrix.platform }} ${{ matrix.arch }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-22.04
          - platform: windows
            arch: x64
            runner: windows-2025
          - platform: macos
            arch: x64
            lipo_arch: x86_64
            runner: macos-15-intel
          - platform: macos
            arch: arm64
            lipo_arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev libfuse2 libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf librsvg2-dev xvfb

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Stage backend and pinned Java runtime
        run: npm run bundle:prepare
        working-directory: frontend

      - name: Build native installer
        run: npm run tauri -- build
        working-directory: frontend

      - name: Verify and smoke-test macOS application and Java runtime
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          dmg_path="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg_path" || { echo "::error::DMG installer not found"; exit 1; }

          mount_path="$(mktemp -d)"
          hdiutil attach -quiet -nobrowse -readonly -mountpoint "$mount_path" "$dmg_path"
          cleanup() {
            hdiutil detach -quiet "$mount_path" || true
            rmdir "$mount_path" 2>/dev/null || true
          }
          trap cleanup EXIT

          app_path="$(find "$mount_path" -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -n "$app_path" || { echo "::error::No .app bundle found inside $dmg_path"; find "$mount_path" -maxdepth 3 -print; exit 1; }

          app_executable="$app_path/Contents/MacOS/focusdesktop"
          java_executable="$app_path/Contents/Resources/runtime/bin/java"
          backend_jar="$app_path/Contents/Resources/backend/focusdesktop.jar"
          test -f "$app_executable" || { echo "::error::App executable not found: $app_executable"; exit 1; }
          test -f "$java_executable" || { echo "::error::Java executable not found: $java_executable"; exit 1; }
          test -f "$backend_jar" || { echo "::error::Backend JAR not found: $backend_jar"; find "$app_path/Contents/Resources" -maxdepth 3 -print; exit 1; }

          echo "App executable architecture:"
          lipo -info "$app_executable"
          echo "Java executable architecture:"
          lipo -info "$java_executable"

          lipo "$app_executable" -verify_arch "${{ matrix.lipo_arch }}"
          lipo "$java_executable" -verify_arch "${{ matrix.lipo_arch }}"
          npm run smoke:tauri:packaged -- "$app_executable"
        working-directory: frontend

      - name: Install Windows NSIS package for smoke test
        if: matrix.platform == 'windows'
        shell: pwsh
        working-directory: frontend
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'NSIS installer was not produced.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'focusdesktop-installed'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS installation failed with exit code $($process.ExitCode)." }
          $app = Get-ChildItem -Path $installDir -Filter 'focusdesktop.exe' -Recurse | Select-Object -First 1
          if ($null -eq $app) { throw "Installed FocusDesktop executable not found under $installDir." }
          "FOCUSDESKTOP_PACKAGED_APP=$($app.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Smoke-test installed Windows application without system Java
        if: matrix.platform == 'windows'
        shell: pwsh
        run: npm run smoke:tauri:packaged -- "$env:FOCUSDESKTOP_PACKAGED_APP"
        working-directory: frontend

      - name: Verify Debian package includes Java runtime and dependency metadata
        if: matrix.platform == 'linux'
        shell: bash
        working-directory: frontend
        run: |
          deb_path="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb_path" || { echo "::error::DEB package not found"; exit 1; }
          extract_dir="$(mktemp -d)"
          trap 'rm -rf "$extract_dir"' EXIT
          dpkg-deb -x "$deb_path" "$extract_dir"
          java_executable="$(find "$extract_dir" -type f -path '*/runtime/bin/java' -print -quit)"
          test -n "$java_executable" || { echo "::error::Bundled Java runtime not found in DEB"; exit 1; }
          test -x "$java_executable" || { echo "::error::Bundled Java runtime is not executable"; exit 1; }
          dependencies="$(dpkg-deb -f "$deb_path" Depends)"
          test -n "$dependencies" || { echo "::error::DEB package dependency metadata is empty"; exit 1; }
          grep -q 'libwebkit2gtk-4.1-0' <<< "$dependencies" || { echo "::error::DEB is missing the WebKitGTK runtime dependency"; exit 1; }
          grep -q 'libgtk-3-0' <<< "$dependencies" || { echo "::error::DEB is missing the GTK runtime dependency"; exit 1; }

      - name: Smoke-test the packaged AppImage without system Java
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke:tauri:packaged -- "$(find src-tauri/target/release/bundle -name '*.AppImage' -print -quit)"
        working-directory: frontend

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: focusdesktop-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/src-tauri/target/release/bundle/**/*.deb
            frontend/src-tauri/target/release/bundle/**/*.AppImage
            frontend/src-tauri/target/release/bundle/**/*.dmg
            frontend/src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish installers to GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download installers from all platform builds
        uses: actions/download-artifact@v4
        with:
          pattern: focusdesktop-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release and installer assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FocusDesktop ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/**/*
